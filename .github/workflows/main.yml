name: Build Nova OS APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'NovaOS_Android_Project.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Extract Android project
        run: unzip -q NovaOS_Android_Project.zip
      - name: Build debug APK
        working-directory: NovaOS_Android
        run: gradle assembleDebug --no-daemon
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NovaOS-debug-APK
          path: NovaOS_Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
